<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ALMS — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <img src="images/alms-logo.jpeg" alt="ALMS logo">
        <div>
          <h1>ALMS</h1>
          <p>Food Rescue Network</p>
        </div>
      </a>
      <nav class="links">
        <a href="index.html">Home</a>
        <a href="registration.html">Register</a>
      </nav>
    </div>
  </header>

  <main class="wrap page-narrow">
    <div class="offline">Start the ALMS server with <code>npm start</code> to connect to the database.</div>
    <a class="back" href="index.html">← Back to ALMS</a>
    
    <section class="card auth-card">
      <div class="card-header">
        <h1>Welcome Back</h1>
        <p class="lead">Log in to manage donations, requests, and volunteer tasks.</p>
      </div>

      <form id="loginForm" class="grid" style="margin-top: 20px;">
        <label>Mobile Number
          <input required name="mobile" type="tel" placeholder="Enter your 10-digit mobile number" autocomplete="username">
        </label>
        <label>Password
          <input required name="password" type="password" placeholder="Enter your password" autocomplete="current-password">
        </label>
        <button type="submit" class="btn btn-primary" style="margin-top: 8px;">Log In</button>
      </form>
      <div class="note" id="loginNote"></div>

      <div style="margin-top: 24px; text-align: center; font-size: 14px; color: var(--muted);">
        Don't have an account yet? <a href="registration.html" style="color: var(--primary); font-weight: 600; text-decoration: underline;">Join the Rescue Network</a>
      </div>
    </section>
  </main>

  <script src="js/common.js"></script>
  <script>
    document.querySelector("#loginForm").onsubmit = async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector("button[type=submit]");
      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in...";

      const body = Object.fromEntries(new FormData(e.target).entries());
      try {
        const res = await api("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        showToast("✓ Logged in successfully!", "success");
        setNote(document.querySelector("#loginNote"), "✓ Logged in successfully! Redirecting...");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1000);
      } catch (err) {
        setNote(document.querySelector("#loginNote"), err.message, true);
        showToast(err.message, "error");
        submitBtn.disabled = false;
        submitBtn.textContent = "Log In";
      }
    };
  </script>
</body>
</html>
