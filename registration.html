<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ALMS Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <img src="images/alms-logo.jpeg" alt="ALMS logo">
        <div>
          <h1>ALMS</h1>
          <p>Join the rescue network</p>
        </div>
      </a>
      <nav class="links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Records</a>
      </nav>
    </div>
  </header>
  <main class="wrap page-narrow">
    <div class="offline">Start the ALMS server with <code>npm start</code> so registrations can be stored.</div>
    <a class="back" href="index.html">← Back to ALMS</a>
    <section class="card auth-card">
      <h1 id="title">Registration</h1>
      <p id="intro" class="lead">Verify your identity to join the rescue network.</p>
      <form id="regForm" class="grid" style="margin-top:16px">
        <input type="hidden" name="role" id="role">
        <label>Full name / organisation
          <input required name="name" placeholder="Full name / organisation name">
        </label>
        <label>Mobile number
          <input required name="mobile" type="tel" placeholder="10-digit mobile number">
        </label>
        <label>Set Password (min 6 chars)
          <input required name="password" type="password" minlength="6" placeholder="Choose a secure password">
        </label>
        <label>Identity proof (ID card, certificate, or letter)
          <input required name="proof" type="file" accept="image/*,.pdf">
        </label>
        <div style="display: flex; gap: 8px; align-items: center; margin-top: 4px;">
          <button type="button" class="btn btn-secondary" id="locBtn" style="width: 100%;">📍 Enable GPS Location</button>
        </div>
        <input type="hidden" name="latitude">
        <input type="hidden" name="longitude">
        <button type="submit" class="btn btn-primary" style="margin-top: 8px;">Complete Registration</button>
      </form>
      <div class="note" id="regNote"></div>
      <div style="margin-top: 24px; text-align: center; font-size: 14px; color: var(--muted);">
        Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: underline;">Log In</a>
      </div>
    </section>
  </main>
  <script src="js/common.js"></script>
  <script>
    const role = new URLSearchParams(location.search).get("role") || "volunteer";
    const names = {
      volunteer: "Volunteer Registration",
      ngo: "NGO / Shelter Registration",
      religious: "Religious Place Registration",
    };
    document.querySelector("#title").textContent = names[role] || "ALMS Registration";
    document.querySelector("#intro").textContent =
      role === "religious"
        ? "Register your temple or gurudwara as a donor and/or food taker. Your details are stored in the ALMS database."
        : "Identity proof and location access are required for safe matching. Create a password to log into your account.";
    document.querySelector("#role").value = role;

    document.querySelector("#locBtn").onclick = function () {
      if (!navigator.geolocation) {
        showToast("Location is not supported by your browser.", "error");
        return;
      }
      this.textContent = "Detecting location...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          document.querySelector("[name=latitude]").value = pos.coords.latitude;
          document.querySelector("[name=longitude]").value = pos.coords.longitude;
          this.textContent = "✓ Location Detected";
          this.style.background = "#dcfce7";
          this.style.color = "#15803d";
          showToast("Location attached successfully!", "success");
        },
        () => {
          this.textContent = "📍 Enable GPS Location";
          showToast("Please allow location access for nearby matching.", "error");
        }
      );
    };

    document.querySelector("#regForm").onsubmit = async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector("[type=submit]");
      submitBtn.disabled = true;
      submitBtn.textContent = "Registering...";

      try {
        await api("/api/register", { method: "POST", body: new FormData(e.target) });
        showToast("✓ Account registered successfully!", "success");
        setNote(document.querySelector("#regNote"), "✓ Registration complete! Redirecting to dashboard...");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 1200);
      } catch (err) {
        setNote(document.querySelector("#regNote"), err.message, true);
        showToast(err.message, "error");
        submitBtn.disabled = false;
        submitBtn.textContent = "Complete Registration";
      }
    };
  </script>
</body>
</html>
