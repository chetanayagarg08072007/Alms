<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ALMS — Role Routing</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const role = params.get('role');
    if (role === 'donor') window.location.replace('pages/donor.html');
    else if (role === 'ngo') window.location.replace('pages/ngo.html');
    else if (role === 'volunteer') window.location.replace('pages/volunteer.html');
    else if (role === 'religious' || role === 'charity') window.location.replace('pages/charity.html');
    else if (role === 'careme') window.location.replace('pages/careme.html');
    else if (role === 'celebration') window.location.replace('pages/celebration.html');
    else window.location.replace('index.html');
  </script>
</head>
<body style="font-family:sans-serif; text-align:center; padding:50px;">
  <p>Redirecting to ALMS...</p>
</body>
</html>
