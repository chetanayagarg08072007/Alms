<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ALMS — Dashboard</title>
  <script>
    const user = JSON.parse(localStorage.getItem('alms_user') || 'null');
    if (user) {
      if (user.role === 'volunteer') window.location.replace('pages/volunteer.html');
      else if (user.role === 'ngo') window.location.replace('pages/ngo.html');
      else window.location.replace('pages/donor.html');
    } else {
      window.location.replace('index.html');
    }
  </script>
</head>
<body style="font-family:sans-serif; text-align:center; padding:50px;">
  <p>Redirecting to ALMS Dashboard...</p>
</body>
</html>
